# Dependabot-konfigurasjon.
#
# Minor- og patch-oppdateringer samles i grupperte PR-er slik at et repo
# gir en håndfull PR-er i uka, ikke en per pakke.
#
# Major-oppdateringer kommer normalt som en PR per pakke og krever manuell
# testing. ESLint og regelpakken er et unntak: peerkravene krever at de
# vurderes sammen, og major-hopp skal fortsatt gjennom manuell vurdering.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      sikkerhetsoppdateringer:
        applies-to: security-updates
        patterns: ["*"]
      eslint:
        applies-to: version-updates
        dependency-type: development
        patterns: ["eslint", "@eslint/js"]
        update-types: ["major", "minor", "patch"]
      utviklingsavhengigheter:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      produksjonsavhengigheter:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]

  # Holder GitHub Actions (checkout, setup-node osv.) oppdatert.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    groups:
      actions:
        update-types: ["minor", "patch"]
